; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =============================================================================
; Environment para SONDES ANTIGAS (ex: RSM412)
; MCU: STM32F100C8Tx
; Conforme: https://github.com/Nevvman18/rs41-nfw/blob/main/fw/COMPILE.md
; =============================================================================
[env:rs41_old_stm32f100c8tx]
platform = ststm32
board = disco_f100rb
framework = arduino

; Sobrescreve o MCU para STM32F100C8
board_build.mcu = stm32f100c8tx
board_build.f_cpu = 24000000L

; Otimização: Aggressive size optimization para caber em 64KB
build_flags = 
    -Oz
    -flto
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DHAL_UART_MODULE_ENABLED
    -DHAL_TIM_MODULE_ENABLED
    -DPC14=PC_14
    -DPC15=PC_15
    -DRSM4x2

; Upload via ST-LINK (conforme COMPILE.md)
upload_protocol = stlink
debug_tool = stlink

; Comandos customizados para OpenOCD
debug_server_ready_pattern = .* Listening on port \d+ for gdb connections

; =============================================================================
; Environment para SONDES NOVAS (ex: RSM414, RSM424)
; MCU: STM32L412RBTxP
; Conforme: https://github.com/Nevvman18/rs41-nfw/blob/main/fw/COMPILE.md
; =============================================================================
[env:rs41_new_stm32l412rbtxp]
platform = ststm32
board = nucleo_l412rb_p
framework = arduino

; Clock do MCU
board_build.f_cpu = 80000000L

; Otimização: Smallest (-Os default) conforme COMPILE.md
build_flags = 
    -Os
    -DHAL_UART_MODULE_ENABLED
    -DRSM4x4

; Upload via ST-LINK (conforme COMPILE.md)
upload_protocol = stlink
debug_tool = stlink